const DATA = {"p":[{"id":"P01-01","el":"太陽","name":"生命力與活力","plain":"你最近可能特別在意自己的精神、活力與存在感。當一件事讓你有熱情、有目標時，會比較有動力投入；長期做著沒有成就感的事，則容易提不起勁。","ex":"開始新計畫時很有衝勁；完成重要工作後，感覺自己重新充電。","q":"最近什麼事情最能讓我感到有精神、有活力？哪些情境又讓我覺得消耗？"},{"id":"P01-02","el":"太陽","name":"權威與領導","plain":"你可能希望發揮影響力，帶領事情朝某個方向前進，也在意自己是否有能力承擔重要角色。","ex":"在團隊中主動帶頭、負責重要決策，或希望自己的專業受到尊重。","q":"我如何運用自己的影響力？我是在承擔責任，還是只希望別人聽從我？"},{"id":"P01-03","el":"太陽","name":"自我認同與主體性","plain":"你可能正在思考自己是誰、重視什麼，以及如何做出符合自身認同的選擇。","ex":"不再只按照家人期待選工作，開始思考真正適合自己的生活方式。","q":"我如何定義自己？我的選擇是否反映真正的自我認同？"},{"id":"P01-04","el":"太陽","name":"意志與人生方向","plain":"你可能需要重新確認人生方向，並找到值得投入意志與心力的目標。","ex":"重新設定年度目標，決定把時間投入事業、學習或個人成長。","q":"我真正想朝哪個方向前進？目前的行動是否與目標一致？"},{"id":"P01-05","el":"太陽","name":"榮耀與自我展現","plain":"你可能希望展現自己的能力與特色，讓努力被看見，也期待獲得應有的肯定。","ex":"分享作品、上台發表成果，或在工作中爭取讓專業被看見的機會。","q":"我想讓別人看見自己的哪一面？即使沒有掌聲，我是否仍肯定自己的價值？"},{"id":"P02-01","el":"月亮","name":"情緒與內在感受","plain":"你可能正在經歷情緒變化，需要辨認自己真正的感受，而不是急著壓下情緒。","ex":"別人一句無心的話讓你難過；忙碌時容易不耐煩，獨處後才發現自己疲憊。","q":"我現在真正的感受是什麼？我是否允許自己表達情緒？"},{"id":"P02-02","el":"月亮","name":"安全感與內在需求","plain":"每個人都有讓自己安心的方式，可能是穩定、陪伴、熟悉感或個人空間。","ex":"希望重要的人主動聯絡；對生活變動焦慮；需要固定節奏才能安心。","q":"什麼事情最能讓我安心？我是否把安全感完全交給別人決定？"},{"id":"P02-03","el":"月亮","name":"母性與照顧滋養","plain":"你可能很重視照顧與被照顧的關係，也習慣透過關心和陪伴滋養身邊的人。","ex":"關心家人的生活、準備家人的需要，或在朋友低潮時陪伴對方。","q":"我是否也願意接受別人的照顧？我有沒有忽略自己的需要？"},{"id":"P02-04","el":"月亮","name":"習慣與本能反應","plain":"面對熟悉情境時，你可能出現不經思考的反應；了解習慣，才能選擇是否繼續沿用。","ex":"一遇到壓力就逃避；不開心時沉默；遇到問題先照顧別人的感受。","q":"我最常出現哪些自動反應？這些習慣現在還適合我嗎？"},{"id":"P02-05","el":"月亮","name":"變化與生命節律","plain":"過去的經驗會留下情感記憶，有些帶來溫暖，有些可能讓你難以放下。","ex":"保存舊照片、因熟悉而不願離開關係，或常拿現在與過去比較。","q":"我是否仍受過去經驗影響？我留戀的是人事物，還是它曾帶給我的感受？"},{"id":"P03-01","el":"水星","name":"思考與邏輯分析","plain":"你可能正在思考一件事情，試著理解原因、意義與可能性；每個人的思考節奏與方式不同。","ex":"遇到問題先分析原因；聽完意見需要時間消化；在腦中預演不同結果。","q":"我平常如何思考問題？是否有時想得太多，反而難以決定？"},{"id":"P03-02","el":"水星","name":"語言與溝通表達","plain":"你如何把想法說出來，也如何讓別人理解你；溝通同時包含聆聽與確認彼此理解。","ex":"在會議提出想法、與家人討論不同意見，或練習說明自己的感受。","q":"我能清楚表達想法嗎？我是否也願意聽懂別人真正想說的內容？"},{"id":"P03-03","el":"水星","name":"學習與知識整合","plain":"你可能正在接觸新的知識、技能或資訊，透過閱讀、觀察、對話與經驗累積學習。","ex":"學習新工具、研究感興趣的主題，或透過別人的經驗找到新做法。","q":"最近我對什麼最有好奇心？我是否把學到的知識運用在生活中？"},{"id":"P03-04","el":"水星","name":"資訊與交易交換","plain":"你可能習慣蒐集資料、比較差異、尋找原因，再決定如何處理；分析也需要適時停止。","ex":"比較不同方案優缺點、研究商品規格，或找出工作問題的關鍵原因。","q":"我能區分事實與猜測嗎？會不會因為分析太久而錯過行動時機？"},{"id":"P03-05","el":"水星","name":"靈活應變與連結","plain":"你每天透過訊息、電話、社群、文件與對話交換資訊；傳遞清楚才能減少誤解。","ex":"傳送工作訊息、分享有用資訊、安排聚會，或協助不同的人取得資料。","q":"我傳達的訊息是否清楚？我是否確認對方真的理解？"},{"id":"P04-01","el":"金星","name":"愛情與情感吸引","plain":"你可能正在關注自己喜歡什麼樣的人、如何表達好感，以及希望在感情中獲得什麼。","ex":"對某個人產生好感、希望有人陪伴，或思考適合自己的感情關係。","q":"我真正欣賞一個人的地方是什麼？我清楚自己在感情中需要什麼嗎？"},{"id":"P04-02","el":"金星","name":"關係與和諧互動","plain":"你可能重視人與人之間的相處，希望彼此尊重、協調與理解；和諧也需要表達立場。","ex":"協調朋友意見、與同事合作，或在分歧時尋找雙方都能接受的方式。","q":"我是否為了維持關係而忽略自己？能否尊重別人也尊重自己？"},{"id":"P04-03","el":"金星","name":"價值觀與自我價值","plain":"你可能正在思考什麼對自己真正重要；價值不只來自收入、外貌或別人的肯定。","ex":"面對工作機會時衡量收入與生活品質，或不再為討好別人犧牲原則。","q":"我最重視的價值是什麼？是否常用別人的評價決定自己夠不夠好？"},{"id":"P04-04","el":"金星","name":"美感與藝術創造","plain":"你可能對美感、色彩、音樂、設計或生活環境敏感，喜歡創造美好的事物。","ex":"布置空間、搭配服裝、拍照、創作或欣賞藝術。","q":"什麼事物讓我感到美好？我是否給自己空間表達喜好與創意？"},{"id":"P04-05","el":"金星","name":"愉悅享受與物質滿足","plain":"你可能重視生活中的舒適、享受與品質，也希望透過休閒讓生活更有樂趣。","ex":"安排旅行、享受美食、購買喜歡的物品，或打造舒適環境。","q":"我真正享受的是什麼？能否在滿足自己與管理資源間取得平衡？"},{"id":"P05-01","el":"火星","name":"行動力與執行能力","plain":"你是否能把想法變成行動，並持續執行直到完成？行動力也包含持續與收尾。","ex":"開始執行計畫、完成拖延已久的事情，或主動處理生活問題。","q":"我現在最想完成什麼？我是否已經採取行動？"},{"id":"P05-02","el":"火星","name":"勇氣與自我主張","plain":"你是否願意表達立場、說出想法，並為自己的選擇負責？勇氣不代表完全不害怕。","ex":"拒絕不合理要求、提出不同意見，或爭取自己想要的機會。","q":"有什麼事我想做卻不敢開始？我能清楚表達需求與界線嗎？"},{"id":"P05-03","el":"火星","name":"競爭與衝突對抗","plain":"遇到競爭、不同意見或利益衝突時，你如何反應？競爭能激發潛力，也可能讓關係緊張。","ex":"比較績效、發生爭執，或面對不公平待遇而想反擊。","q":"我遇到衝突時如何處理？我是在解決問題，還是只想證明自己對？"},{"id":"P05-04","el":"火星","name":"慾望與追求動力","plain":"你內心真正想得到什麼？可能是成就、愛情、財富、自由或某種生活體驗。","ex":"為升遷努力、追求喜歡的人，或希望改善生活條件。","q":"我現在最渴望得到什麼？這個目標真的符合我的需要嗎？"},{"id":"P05-05","el":"火星","name":"力量與突破障礙","plain":"遇到阻礙時，你是否願意面對困難、調整方法，繼續尋找突破？力量也包含改變策略。","ex":"工作受挫後重新規劃、克服學習困難，或在變動中找新方法。","q":"現在最大的阻礙是什麼？我需要更努力，還是換一種方法？"},{"id":"P06-01","el":"木星","name":"擴張與成長發展","plain":"你可能希望拓展生活可能性，接觸更多經驗、知識與不同的人；成長也包含視野與能力擴展。","ex":"學習新技能、拓展事業、認識不同領域的人，或開始新計畫。","q":"我希望在哪個部分成長？是否願意走出熟悉環境？"},{"id":"P06-02","el":"木星","name":"幸運與機會資源","plain":"機會可能來自別人的協助、過去累積或主動尋找；幸運也包含看見並把握機會。","ex":"朋友介紹工作、遇到提攜自己的前輩，或獲得新的合作機會。","q":"最近有哪些機會值得留意？我是否準備好接住別人的幫助？"},{"id":"P06-03","el":"木星","name":"智慧與高等學習","plain":"你可能希望理解更深層的知識，透過學習、研究與經驗建立判斷能力。","ex":"進修課程、研究哲學或文化，或把經驗整理成自己的方法。","q":"我最近學到什麼新觀點？能否將知識轉化成實際能力？"},{"id":"P06-04","el":"木星","name":"信念與道德價值","plain":"你有自己的原則，也會用信念判斷事情；遇到不同觀點時，可以重新檢視信念。","ex":"面對利益與原則的選擇、思考公平正義，或討論不同價值觀。","q":"我最堅持的信念是什麼？能否尊重不同價值觀又保有原則？"},{"id":"P06-05","el":"木星","name":"豐盛與慷慨分享","plain":"豐盛不只是金錢，也可能是知識、時間、資源、關係與心靈上的富足。","ex":"分享專業知識、幫助有需要的人、提供工作機會，或分享成果。","q":"我認為真正的豐盛是什麼？我是否懂得接受，也願意適度分享？"},{"id":"P07-01","el":"土星","name":"限制與現實考驗","plain":"生活不一定照期待發展，有時會遇到資源、時間或外在條件限制；看清現實是尋找可行方向。","ex":"預算不足而調整計畫、進度受限，或接受暫時無法改變的情況。","q":"我現在面對什麼限制？哪些可以改變，哪些需要先接受？"},{"id":"P07-02","el":"土星","name":"責任與承擔能力","plain":"你會在工作、家庭、承諾與選擇中承擔責任；負責不代表所有事情都必須自己扛。","ex":"負責工作、照顧家人、履行承諾，或承擔決定的後果。","q":"我目前承擔哪些責任？哪些是真正屬於我的？"},{"id":"P07-03","el":"土星","name":"紀律與結構建立","plain":"長期發展通常需要規則、流程與穩定習慣；紀律能幫助重要事情持續做好。","ex":"固定運動、建立工作流程、規劃待辦事項。","q":"我的生活是否有足夠秩序？哪個習慣能幫助我穩定前進？"},{"id":"P07-04","el":"土星","name":"時間與長期累積","plain":"有些成果需要時間、耐心與持續投入；每次小累積都可能成為未來基礎。","ex":"長期學習技能、累積工作經驗、儲蓄或經營關係。","q":"有什麼事情值得長期投入？是否因短期看不到成果就想放棄？"},{"id":"P07-05","el":"土星","name":"成熟與自我掌控","plain":"隨經驗增加，你會逐漸學會管理情緒、時間與選擇；成熟也包含從錯誤中調整。","ex":"面對批評不急著反擊、遇壓力先冷靜分析，或管理自己的生活。","q":"我在哪些方面比過去成熟？壓力下能否掌握自己的反應？"},{"id":"P08-01","el":"天王星","name":"自由與獨立自主","plain":"你可能希望保有自己的空間與選擇權，不喜歡過度控制；自主不代表拒絕合作。","ex":"自己決定工作方式、不喜歡被過度干涉，或選擇不同於家人期待的生活。","q":"我需要哪些自由？能否保有自主也尊重別人的選擇？"},{"id":"P08-02","el":"天王星","name":"突破與改革變革","plain":"當舊方法不再適合，你可能想打破舊規則，尋找新的做法；改變也可以是改善流程。","ex":"改變工作流程、調整生活方式，或提出制度改善建議。","q":"哪些舊方法已不適合我？我真正想改變的是什麼？"},{"id":"P08-03","el":"天王星","name":"創新與前瞻思維","plain":"你可能容易想到不同方法，喜歡探索新工具、觀念與可能性；創新也需要落地。","ex":"使用新科技、設計新服務模式，或提出不同的解決方案。","q":"最近有什麼新想法值得嘗試？能否把創意轉成行動？"},{"id":"P08-04","el":"天王星","name":"突發變化與不確定性","plain":"意料之外的變化可能打亂安排，也可能帶來機會；面對不確定性需要保持彈性。","ex":"臨時更換計畫、遇到突發事件，或熟悉環境突然改變。","q":"面對意外變化我如何反應？是否為自己保留調整空間？"},{"id":"P08-05","el":"天王星","name":"覺醒與群體革新","plain":"你可能突然看見過去沒注意到的問題，重新思考自己與群體、社會的關係。","ex":"關注社會議題、參與社群行動，或與志同道合者改善環境。","q":"最近什麼觀念正在改變？希望為自己或群體帶來什麼不同？"},{"id":"P09-01","el":"海王星","name":"夢想與想像創造","plain":"你可能有豐富想像力，對未來抱持期待，也喜歡透過創作表達內心；夢想需要逐步實現。","ex":"想像理想生活、寫故事、創作音樂，或規劃尚未實現的夢想。","q":"我最想實現的夢想是什麼？能為它採取哪個實際步驟？"},{"id":"P09-02","el":"海王星","name":"靈性與超越意識","plain":"你可能思考生命意義與精神需要，透過靜心、冥想、宗教或哲學尋找理解。","ex":"參與靈性課程、練習冥想、閱讀哲學書籍，或思考生命意義。","q":"什麼事情讓我感受到生命深度？如何在日常找到內心平靜？"},{"id":"P09-03","el":"海王星","name":"共感與慈悲奉獻","plain":"你可能容易感受到別人的情緒，也願意關心有需要的人；同理也需要界線。","ex":"看到別人難過就想幫忙、投入公益服務，或陪伴朋友低潮。","q":"我能感受別人的需要，同時照顧自己的情緒與界線嗎？"},{"id":"P09-04","el":"海王星","name":"理想化與幻象迷惑","plain":"有時容易把人事物想得過於美好，忽略現實差異；理想也需要事實確認。","ex":"對關係期待過高、相信機會一定成功，或忽略明顯警訊。","q":"我看到的是事實，還是自己希望的樣子？願意面對真實嗎？"},{"id":"P09-05","el":"海王星","name":"界線消融與自我融合","plain":"你可能容易與別人的情緒、期待混在一起，甚至忘記自己的需求；親密也需要界線。","ex":"別人不開心就覺得自己有責任、難以拒絕，或失去自己的生活重心。","q":"我能分辨自己的感受與別人的感受嗎？哪些關係需要重新建立界線？"},{"id":"P10-01","el":"冥王星","name":"權力與控制關係","plain":"在人際、工作或家庭中，可能出現誰掌握主導權、誰決定事情的問題；理解權力關係有助於看見控制與界線。","ex":"遇到強勢主管、關係中有人替別人做決定，或自己難以接受失去主導權。","q":"我是否過度想掌控事情？關係中的權力是否平衡？"},{"id":"P10-02","el":"冥王星","name":"深層轉化與蛻變","plain":"有些改變需要重新理解自己，改變長期思考模式與生活方式，而不只是換環境。","ex":"離開不適合的關係、重新建立生活方向，或改變困住自己的模式。","q":"哪些事情已到了需要改變的階段？我願意放下什麼？"},{"id":"P10-03","el":"冥王星","name":"陰影與潛意識探索","plain":"不願面對的情緒、恐懼與欲望可能反覆出現；理解它們有助於看見行為背後的原因。","ex":"對某類人特別反感、反覆陷入相似關係，或有說不清的強烈情緒。","q":"我最不願承認的自己是什麼？反應背後是否有未理解的需求？"},{"id":"P10-04","el":"冥王星","name":"危機與失去重生","plain":"失去、結束或重大轉折可能迫使我們重新整理生活；也可能讓我們看見真正重要的事。","ex":"經歷分手、工作變動、重大挫折，或重新面對家庭與人生變化。","q":"我正在經歷什麼結束或轉變？它讓我重新看見什麼？"},{"id":"P10-05","el":"冥王星","name":"執著與深層力量","plain":"有些事情很難放下，可能因投入太多、害怕失去或希望掌控結果；力量也包括放手。","ex":"一直想證明自己正確、難以放下一段關係，或投入目標而忽略其他生活。","q":"我最放不下的是什麼？這份堅持支持我，還是限制我？"},{"id":"P11-01","el":"北交點","name":"人生方向與發展道路","plain":"你可能正在思考未來想走向哪裡，希望找到更符合期待的人生方向；方向可透過經驗逐漸確認。","ex":"考慮轉換職涯、開始新學習，或重新安排未來生活目標。","q":"我希望未來過什麼生活？目前選擇是否帶我靠近那個方向？"},{"id":"P11-02","el":"北交點","name":"成長課題與未知探索","plain":"成長常發生在不熟悉的地方；嘗試過去不擅長的事，可能發現新的能力。","ex":"第一次擔任管理職、嘗試公開表達，或接觸不同專業。","q":"有哪些不熟悉卻值得嘗試的事？是否因害怕失敗而停留原地？"},{"id":"P11-03","el":"北交點","name":"機遇與生命交會","plain":"重要轉折可能來自相遇、新環境或意外機會，讓我們看見不同道路。","ex":"因認識某人接觸新工作、參加活動找到合作機會，或旅行得到啟發。","q":"最近有哪些相遇或機會值得留意？我願意走進新環境嗎？"},{"id":"P11-04","el":"北交點","name":"突破慣性與經驗拓展","plain":"熟悉方式容易讓人停留；離開舒適圈能接觸新經驗，但不必否定過去。","ex":"嘗試不同工作方法、認識不同背景的人，或開始以前不敢做的活動。","q":"哪些習慣限制我的發展？嘗試不同方式可能帶來什麼？"},{"id":"P11-05","el":"北交點","name":"生命意義與自我實現","plain":"你可能希望生命具有更深意義，透過創造、服務、教學或貢獻實現理想。","ex":"投入有意義的工作、分享專業，或希望透過某件事幫助更多人。","q":"我希望人生留下什麼價值？如何把它轉化成行動？"},{"id":"P12-01","el":"南交點","name":"過往經驗與生命累積","plain":"過去經歷形成現在的能力、觀念與判斷；成功與挫折都可能成為重要資源。","ex":"運用過去工作經驗解決問題，或從曾經失敗的事學會新方法。","q":"哪些過去經驗已成為我的資產？是否仍被某些經歷限制？"},{"id":"P12-02","el":"南交點","name":"天賦與既有能力","plain":"有些事情做起來特別自然，可能是長期累積的能力；認識優勢能更有效運用資源。","ex":"擅長整理資訊、理解別人情緒，或很快掌握某種技能。","q":"哪些事情我做起來比別人自然？是否充分運用自己的優勢？"},{"id":"P12-03","el":"南交點","name":"慣性與舒適模式","plain":"熟悉方式容易帶來安全感，但也可能讓人不願嘗試新方法；需要辨認哪些慣性值得保留。","ex":"遇到問題總用同一套方法、待在熟悉環境，或不願嘗試新角色。","q":"哪些習慣反覆出現？它們在幫助我，還是在阻礙成長？"},{"id":"P12-04","el":"南交點","name":"放下與釋放減損","plain":"有些事情即使曾經重要，也不一定需要一直帶著走；放下能把精力留給重要的事。","ex":"放下不適合的工作模式、不再執著過去爭執，或減少不必要消耗。","q":"哪些事情已不需要繼續承擔？放下後能騰出什麼空間？"},{"id":"P12-05","el":"南交點","name":"經驗整合與生命傳承","plain":"人生累積的經驗與智慧，經過整理與分享，可以成為幫助自己與他人的資源。","ex":"把工作經驗整理成教學方法、分享人生心得，或傳授技能給下一代。","q":"我累積了哪些值得珍惜的經驗？如何轉化成對自己或他人有幫助的價值？"}],"s":[{"id":"S01-01","el":"牡羊","name":"開創與主動出擊","plain":"遇到事情時，你可能不喜歡一直等待，而傾向先採取行動，讓事情動起來。","ex":"主動提出活動構想、第一個報名新課程，或在團隊沒人決定時先提出方案。","q":"我是否習慣主動開始？有時需要先行動，還是先了解情況？"},{"id":"S01-02","el":"牡羊","name":"勇氣與冒險精神","plain":"面對不熟悉的事情，你可能願意嘗試，即使不知道結果，也願意給自己一次機會。","ex":"嘗試新工作、獨自旅行、參加不熟悉的活動，或挑戰以前不敢做的事。","q":"有什麼事一直想嘗試卻沒開始？我能在勇敢與評估風險間平衡嗎？"},{"id":"S01-03","el":"牡羊","name":"自我意識與獨立性","plain":"你可能清楚自己想要什麼，也希望保有決定權，不想完全依賴別人的安排。","ex":"自己決定工作方向、選擇生活方式，或不因朋友都選同一條路就跟著走。","q":"我能清楚表達想法嗎？我是獨立選擇，還是刻意與別人不同？"},{"id":"S01-04","el":"牡羊","name":"熱情與即時行動","plain":"對有興趣的事情，你可能立刻投入、充滿熱情；也要留意熱情過後能否持續。","ex":"想到新點子就開始執行、看到課程馬上報名，或有靈感就想立刻完成。","q":"哪些事最容易點燃熱情？能否把衝勁轉成持續行動？"},{"id":"S01-05","el":"牡羊","name":"競爭與突破挑戰","plain":"面對挑戰時，你可能想超越自己或證明能力；競爭能激發潛力，但不必每件事都分輸贏。","ex":"參加比賽、挑戰業績目標，或看到別人做到也想試試。","q":"我追求自我突破，還是一定要贏過別人？沒有競爭對象還願意努力嗎？"},{"id":"S02-01","el":"金牛","name":"穩定與安全建立","plain":"你可能重視生活穩定，希望事情有規律與保障；面對變化時需要時間適應。","ex":"喜歡固定作息、希望收入穩定，或重大決定前先確認生活安排。","q":"什麼生活讓我安心？是否因害怕改變而錯過可能？"},{"id":"S02-02","el":"金牛","name":"價值與資源累積","plain":"你可能重視實際資源，願意花時間累積金錢、能力、物品與人際支持。","ex":"定期儲蓄、購買耐用品、培養專業能力，或長期經營事業。","q":"我重視累積哪些資源？是在建立價值，還是因害怕失去而囤積？"},{"id":"S02-03","el":"金牛","name":"感官享受與生活品質","plain":"你可能重視舒適與感官感受，喜歡美食、舒服環境、質感物品與放鬆生活。","ex":"品嚐美食、布置居家、挑選質感衣物，或安排舒服的休閒時間。","q":"哪些體驗讓我滿足？能否享受生活又不讓物質享受成為壓力？"},{"id":"S02-04","el":"金牛","name":"耐心與持續耕耘","plain":"你可能相信慢慢累積比急著求成果可靠，認定方向後願意持續投入。","ex":"長期經營專業、持續練習技能，或累積存款與工作經驗。","q":"什麼事值得持續耕耘？能否堅持同時檢查方向？"},{"id":"S02-05","el":"金牛","name":"堅定與固守慣性","plain":"你可能有自己的原則，不容易因外界意見改變；有時也可能太習慣原本方式。","ex":"習慣固定流程、不喜歡臨時更動計畫，或情況改變仍想維持原安排。","q":"我堅持的是原則，還是習慣？什麼情況下願意重新考慮？"},{"id":"S03-01","el":"雙子","name":"溝通與資訊交流","plain":"你可能喜歡透過說話、討論與交換資訊理解事情；交流也是整理思緒的方法。","ex":"與朋友聊天、工作交換意見，或透過討論找到解決方法。","q":"我能把想法說清楚嗎？交流時有認真聆聽嗎？"},{"id":"S03-02","el":"雙子","name":"好奇與多元學習","plain":"你可能對許多事情有興趣，喜歡接觸不同知識，也容易從新資訊產生問題。","ex":"研究不同主題、看到新工具就想了解，或參加各種課程。","q":"最近什麼引起我的好奇？能否把興趣整理成有用知識？"},{"id":"S03-03","el":"雙子","name":"靈活與適應變化","plain":"環境改變時，你可能容易調整方法，不一定堅持只有一種做法。","ex":"計畫改變時快速調整、突發問題時找替代方案，或適應不同團隊。","q":"我能接受計畫變動嗎？彈性是否有時讓自己缺乏持續性？"},{"id":"S03-04","el":"雙子","name":"雙重視角與多面思考","plain":"你可能習慣從不同角度看事情，不急著接受單一答案；想法太多也可能難決定。","ex":"理解討論雙方立場、列出不同選項，或想到事情還有其他可能。","q":"我能接受事情有不同答案嗎？如何選出適合自己的方向？"},{"id":"S03-05","el":"雙子","name":"連結與社交互動","plain":"你可能擅長透過不同人際關係交換資訊、建立聯繫，也喜歡認識新朋友。","ex":"參加聚會、加入社群，或介紹不同領域的人互相認識。","q":"我是否善用交流擴展視野？能否建立有品質的關係？"},{"id":"S04-01","el":"巨蟹","name":"情感與內在感受","plain":"你可能容易受到環境與人際氣氛影響，對別人的態度、語氣及情緒變化敏感。","ex":"察覺別人語氣改變、看到感人事情落淚 ,"q":"我對自己有什麼要求？能否接受已經足夠好？"},{"id":"S06-05","el":"處女","name":"務實與問題解決","plain":"面對困難時，你可能先找出問題，再思考實際可行的方法。","ex":"設備故障先找原因、工作問題列出步驟，或比較方案可行性。","q":"真正需要解決的問題是什麼？能否先從一件具體小事開始？"},{"id":"S07-01","el":"天秤","name":"公平與平衡協調","plain":"你可能在意事情是否公平，希望每個人的需求都被考慮，並尋找平衡方式。","ex":"分配工作希望公平、家庭討論考慮每個人，或關注不合理待遇。","q":"我能公平看待自己與別人的需求嗎？是否忽略自己想要什麼？"},{"id":"S07-02","el":"天秤","name":"關係與合作互動","plain":"你可能重視互動，希望透過合作、協商與配合完成事情。","ex":"與同事分工、和朋友規劃活動，或討論彼此需求。","q":"我在合作中扮演什麼角色？能否表達自己的需要？"},{"id":"S07-03","el":"天秤","name":"美感與和諧追求","plain":"你可能喜歡美好環境、協調色彩與舒服氣氛，也在意生活品味。","ex":"布置空間、搭配服裝，或安排讓大家舒服的聚會環境。","q":"哪些事物讓我感到和諧？是否太在意表面完美而忽略感受？"},{"id":"S07-04","el":"天秤","name":"理性衡量與多方考量","plain":"你可能比較不同選項，考慮各方立場與結果；周全也可能造成猶豫。","ex":"比較價格品質、衡量工作條件，或先聽雙方意見。","q":"我是否已有足夠資訊？會不會為了讓每個人滿意而難以決定？"},{"id":"S07-05","el":"天秤","name":"外交與衝突調解","plain":"遇到不同意見時，你可能用委婉方式溝通，尋找雙方可接受的解決方式。","ex":"化解朋友誤會、協調不同部門，或在家庭爭執中傳達想法。","q":"我能適當處理衝突嗎？是否為避免不愉快而擱置問題？"},{"id":"S08-01","el":"天蠍","name":"深層情感與強烈投入","plain":"重視的人事物可能讓你投入很多感情與心力，不喜歡只有表面互動。","ex":"用心經營關係、全心投入工作，或對在意的事有強烈堅持。","q":"我最在意什麼？投入讓我充實，還是讓自己失去平衡？"},{"id":"S08-02","el":"天蠍","name":"洞察與隱藏真相探索","plain":"你可能不只看表面，會想知道背後原因，也喜歡觀察言行與事情發展。","ex":"發現話語矛盾、追查問題原因，或研究心理與人性。","q":"我掌握的是事實還是猜測？能否保持好奇而不急著下結論？"},{"id":"S08-03","el":"天蠍","name":"信任與親密界線","plain":"你可能重視信任，不容易隨便敞開自己；建立信任後希望關係真誠深入。","ex":"不喜歡別人透露秘密、需要時間信任，或希望關係沒有隱瞞。","q":"我是否願意信任別人？能否保護自己也給予適當信任？"},{"id":"S08-04","el":"天蠍","name":"意志與掌控力量","plain":"認定事情時，你可能展現強烈意志，希望掌握局面；也需留意是否過度控制。","ex":"持續追求目標、難以改變決定，或事情失控時焦慮。","q":"哪些事需要我掌握？哪些可以交給別人或允許自然發展？"},{"id":"S08-05","el":"天蠍","name":"蛻變與重生力量","plain":"重大改變、結束或失去可能讓你重新整理自己，發現新的力量與方向。","ex":"結束不適合的關係後重新開始、工作轉型，或挫折後改變生活方式。","q":"哪些地方需要改變？是否願意放下不適合的模式？"},{"id":"S09-01","el":"射手","name":"自由與探索冒險","plain":"你可能喜歡探索未知，不希望生活一直停留在固定模式，透過旅行與學習發現可能。","ex":"規劃旅行、嘗試新活動、接觸異國文化，或認識不同背景的人。","q":"我最想探索什麼？是否因追求自由而忽略責任？"},{"id":"S09-02","el":"射手","name":"信念與人生哲學","plain":"你可能思考事情背後的意義，想知道為什麼而生活，以及值得堅持的原則。","ex":"思考人生方向、閱讀哲學宗教書籍，或因理念投入一件事。","q":"我最相信什麼？信念是自己思考形成，還是沿用別人的觀念？"},{"id":"S09-03","el":"射手","name":"樂觀與成長機會","plain":"遇到困難時，你可能比較容易看見其他可能，相信未來能改善；樂觀也需要行動。","ex":"受挫後尋找機會、鼓勵自己再試一次，或期待新環境帶來發展。","q":"我能從困難看見可能嗎？樂觀是否有實際行動支持？"},{"id":"S09-04","el":"射手","name":"智慧與知識拓展","plain":"你可能不滿足於表面資訊，希望深入不同領域，建立更完整的世界觀。","ex":"進修專業、閱讀跨領域書籍、參加講座或旅行認識文化。","q":"哪些知識正在拓展視野？我是否願意接受自己原本不知道的事？"},{"id":"S09-05","el":"射手","name":"真理追求與直率表達","plain":"你可能重視真實與坦率，希望直接說出想法；表達也需要考慮對方能否理解。","ex":"指出問題、對不合理事情表態，或堅持自己認為正確的觀點。","q":"我說的是經過思考的觀點，還是一時反應？能否坦率又尊重？"},{"id":"S10-01","el":"摩羯","name":"責任與自我承擔","plain":"你可能習慣對選擇負責，也願意承擔應完成的任務；但不必把所有事都扛在身上。","ex":"處理家庭事務、負責重要工作，或盡力完成承諾。","q":"我承擔的責任合理嗎？是否也背負了不屬於自己的責任？"},{"id":"S10-02","el":"摩羯","name":"目標與成就追求","plain":"你可能喜歡設定目標，希望透過努力看見具體成果，例如專業、經濟或人生階段成就。","ex":"設定年度目標、努力升遷、建立事業，或追求專業肯定。","q":"我真正想完成什麼？這是自己的目標還是外界期待？"},{"id":"S10-03","el":"摩羯","name":"紀律與長期規劃","plain":"你可能重視計畫與執行，透過有步驟的安排逐漸完成目標。","ex":"長期學習、規劃退休、定期儲蓄，或建立工作流程。","q":"我有清楚規劃嗎？計畫變動時能否保留彈性？"},{"id":"S10-04","el":"摩羯","name":"現實判斷與務實策略","plain":"做選擇時你可能先考慮現實條件，評估資源、成本與結果；務實也要保留嘗試空間。","ex":"評估薪資與發展、計算投資成本，或規劃可行方案。","q":"選擇符合現實嗎？是否因太重視安全而限制可能？"},{"id":"S10-05","el":"摩羯","name":"權威與社會地位建立","plain":"你可能希望透過專業、能力與成果建立社會位置，讓別人信任你的判斷。","ex":"成為主管、建立專業品牌、爭取管理職，或累積公信力。","q":"我希望建立什麼社會角色？追求的是職位還是真正的影響力？"},{"id":"S11-01","el":"水瓶","name":"獨立思考與自主意識","plain":"你可能習慣用自己的方式思考，不因大家都這麼做就直接接受。","ex":"對流行保有看法、不盲從團體決定，或選擇不同生活方式。","q":"我的想法經過自己思考嗎？能否保有獨立也聽進不同意見？"},{"id":"S11-02","el":"水瓶","name":"創新與突破傳統","plain":"舊方法不再適合時，你可能想嘗試新做法，不一定照既定規則走。","ex":"用新科技改善工作、提出管理方式，或嘗試新合作模式。","q":"哪些傳統做法值得重新檢視？新想法能真正解決問題嗎？"},{"id":"S11-03","el":"水瓶","name":"群體意識與社會連結","plain":"你可能關心自己與團體、社群及社會的關係，也希望找到理念相近的人交流合作。","ex":"加入社群、參與公共議題、與志同道合者合作。","q":"我希望參與什麼群體？能否保有特色又建立連結？"},{"id":"S11-04","el":"水瓶","name":"平等理念與人道精神","plain":"你可能重視每個人都應受到尊重，不希望因背景或條件不同而遭受不公平。","ex":"參與公益、關心弱勢議題，或主張公平制度與工作環境。","q":"我如何理解平等？是否願意用行動支持自己的理念？"},{"id":"S11-05","el":"水瓶","name":"客觀理性與超然視角","plain":"遇到事情時你可能先退一步觀察，不急著被情緒帶著走；客觀也要留意情感需求。","ex":"爭執時整理事實、分析不同立場，或先觀察整體情況。","q":"我能保持客觀嗎？太過理性時是否忽略自己或別人的感受？"},{"id":"S12-01","el":"雙魚","name":"共感與慈悲關懷","plain":"你可能容易感受到別人的情緒，也願意理解不同處境，並提供陪伴與幫助。","ex":"主動關心難過的人、陪伴低潮朋友，或參與關懷活動。","q":"我能理解別人又不把所有情緒變成自己的責任嗎？"},{"id":"S12-02","el":"雙魚","name":"直覺與靈性探索","plain":"你可能除了理性分析，也留意內在感受與直覺，透過靜心或探索理解內在世界。","ex":"獨處整理思緒、對心理靈性有興趣，或決策時兼顧理性與直覺。","q":"我願意聆聽內在感受嗎？能否讓直覺與實際資訊相互驗證？"},{"id":"S12-03","el":"雙魚","name":"想像與藝術創造","plain":"你可能想像力豐富，容易得到靈感，喜歡透過藝術、音樂、影像或文字表達。","ex":"寫作、畫畫、攝影、音樂創作，或設計新作品。","q":"什麼最容易啟發創意？是否給自己空間發揮想像？"},{"id":"S12-04","el":"雙魚","name":"融合與界線消融","plain":"你可能容易融入不同的人與環境，但太容易配合也可能模糊自己的需求與界線。","ex":"為讓大家開心改變安排、難以拒絕要求，或失去自己的生活節奏。","q":"我清楚自己的感受與需求嗎？親近別人時能否保有界線？"},{"id":"S12-05","el":"雙魚","name":"理想與超越現實","plain":"你可能對生活抱持理想，希望世界更美好；理想也需要回到現實找到實踐方法。","ex":"投入有意義的工作、夢想幫助更多人，或建立理想生活方式。","q":"我期待的理想生活是什麼？如何轉化為可以開始的行動？"}],"h":[{"id":"H01-01","el":"第一宮","name":"自我與個人身份","plain":"這裡關於你如何認識自己，以及如何看待自己的身份。面對不同人生角色時，你可能重新思考自己真正是誰。","ex":"開始新工作、進入新階段，或重新思考希望成為什麼樣的人。","q":"放下別人給我的身份與期待，我會如何介紹真正的自己？"},{"id":"H01-02","el":"第一宮","name":"外在形象與第一印象","plain":"這裡關於別人初次接觸你時的印象，以及你如何呈現自己；外表、談吐與態度都會形成形象。","ex":"第一次見客戶、面試、認識新朋友，或建立個人品牌。","q":"我希望別人如何認識我？呈現的形象與內在一致嗎？"},{"id":"H01-03","el":"第一宮","name":"身體與生命活力","plain":"這裡關於身體狀態、精神活力與存在感；身體是體驗生活與採取行動的基礎。","ex":"注意精神狀態、調整作息、開始運動，或發現需要休息。","q":"我最近如何感受身體？是否好好照顧精神與體力？"},{"id":"H01-04","el":"第一宮","name":"自主行動與生命開端","plain":"這裡關於如何開始事情，以及是否願意為選擇採取行動；新階段需要跨出第一步。","ex":"開始新工作、搬家、建立新習慣，或展開計畫。","q":"有什麼想開始卻沒行動？我願意踏出哪一步？"},{"id":"H01-05","el":"第一宮","name":"個人存在與自我表達","plain":"這裡關於讓別人看見自己的存在，透過言行、風格與選擇表達特色。","ex":"在團體表達意見、分享作品，或展現個人風格。","q":"我願意自然展現自己嗎？是否因擔心眼光而隱藏想法？"},{"id":"H02-01","el":"第二宮","name":"金錢與個人財富","plain":"這裡關於如何賺取、使用與管理自己的金錢，也包含對財富的看法。","ex":"規劃收入支出、存錢、增加收入來源，或改善財務穩定。","q":"我如何看待金錢？理財方式支持我想要的生活嗎？"},{"id":"H02-02","el":"第二宮","name":"資源與物質擁有","plain":"這裡不只有金錢，也包含物品、工具、技能與可運用資源；如何使用會影響生活品質。","ex":"管理設備與物品、運用專業技能，或整理可用資源。","q":"我已擁有哪些資源？哪些可以更有效運用？"},{"id":"H02-03","el":"第二宮","name":"自我價值與能力肯定","plain":"這裡關於如何評價自己，以及是否相信自己的能力值得肯定。","ex":"談自己的專業價值、決定服務價格，或面對批評時確認能力。","q":"我真正看見自己的價值嗎？是否常低估能力或依賴肯定？"},{"id":"H02-04","el":"第二宮","name":"生活安全與物質保障","plain":"這裡關於建立生活保障，讓自己面對變化時有所準備。","ex":"準備緊急預備金、安排保險、規劃支出或建立穩定收入。","q":"哪些事情讓我感到有保障？未來還需要哪些準備？"},{"id":"H02-05","el":"第二宮","name":"價值選擇與資源分配","plain":"這裡關於什麼值得投入，以及如何分配有限的時間、金錢與精力。","ex":"決定花錢在學習、旅行或購物；安排工作與休息。","q":"我的資源流向哪些事情？符合真正重視的價值嗎？"},{"id":"H03-01","el":"第三宮","name":"溝通與訊息交流","plain":"這裡關於日常交換訊息、表達想法，以及與周遭的人保持聯繫。","ex":"傳訊息、打電話、與同事討論，或說明自己的想法。","q":"我的溝通讓人容易理解嗎？我有聽懂對方嗎？"},{"id":"H03-02","el":"第三宮","name":"基礎學習與知識吸收","plain":"這裡關於日常學習、資訊接收與基本知識累積，學習也來自閱讀、觀察與生活經驗。","ex":"學新技能、閱讀文章、上短期課程，或查詢感興趣資訊。","q":"最近我學習什麼？有把資訊整理成自己的理解嗎？"},{"id":"H03-03","el":"第三宮","name":"手足與近親互動","plain":"這裡關於兄弟姊妹、表親與較親近同輩的日常相處及彼此影響。","ex":"與手足聯絡、和表親聚會，或維持熟識朋友互動。","q":"我與親近同輩的關係如何？能否用適合彼此的方式維繫？"},{"id":"H03-04","el":"第三宮","name":"短途移動與日常往來","plain":"這裡關於日常移動、通勤、拜訪與周遭環境接觸。","ex":"上下班、附近採買、拜訪朋友，或安排日常行程。","q":"我的日常移動是否順暢？能否走出去接觸新環境？"},{"id":"H03-05","el":"第三宮","name":"思考模式與資訊連結","plain":"這裡關於整理訊息、連結想法，從日常資訊形成理解。","ex":"從新聞聯想到生活議題、整理不同意見，或連結工作資訊形成新方法。","q":"我如何整理大量資訊？哪些真正有幫助，哪些讓我混亂？"},{"id":"H04-01","el":"第四宮","name":"家庭與原生家庭關係","plain":"這裡關於家庭成員關係，以及成長過程中家庭對價值觀與相處模式的影響。","ex":"與父母討論安排、探望家人，或重新思考家庭相處方式。","q":"家庭經驗如何影響我？哪些模式想保留或調整？"},{"id":"H04-02","el":"第四宮","name":"居住環境與不動產","plain":"這裡關於居住地、房屋、不動產與生活環境帶來的感受。","ex":"搬家、買房、租屋、裝修，或重新整理空間。","q":"目前居住環境符合需要嗎？希望建立什麼生活空間？"},{"id":"H04-03","el":"第四宮","name":"情感根源與內在安全感","plain":"這裡關於深層情感需求，以及如何建立真正的安全感。","ex":"面對變動容易焦慮、需要熟悉環境才能放鬆，或在意他人態度。","q":"內心真正需要什麼？安全感能否從內在建立？"},{"id":"H04-04","el":"第四宮","name":"家族傳承與生命根基","plain":"這裡關於家族歷史、文化、價值觀與生活經驗；傳承不代表所有傳統都必須照單全收。","ex":"了解家族故事、承接家庭事業，或思考家族觀念的影響。","q":"家族傳承給我哪些資產？哪些值得延續，哪些需要重新選擇？"},{"id":"H04-05","el":"第四宮","name":"私人生活與生命歸宿","plain":"這裡關於私人生活，以及離開外在角色後希望如何安頓自己。","ex":"規劃退休、建立家庭生活、安排獨處，或思考長期居住地。","q":"不必扮演角色時，我想過什麼生活？什麼讓我真正安定？"},{"id":"H05-01","el":"第五宮","name":"子女與養育關係","plain":"這裡關於子女、養育與親子互動，也包含陪伴下一代發展能力。","ex":"陪孩子學習、安排親子活動、討論興趣，或在照顧與放手間平衡。","q":"我如何理解孩子需要？是在陪伴他成為自己，還是要求他符合期待？"},{"id":"H05-02","el":"第五宮","name":"戀愛與浪漫情感","plain":"這裡關於戀愛中的喜歡、心動、浪漫與情感表達，不只關係是否進入婚姻。","ex":"約會、收到驚喜、對人產生好感，或享受甜蜜相處。","q":"我喜歡怎樣的戀愛互動？能自在表達喜歡並保留真實感受嗎？"},{"id":"H05-03","el":"第五宮","name":"創造力與自我表現","plain":"這裡關於發揮創意，創造作品與成果，透過不同形式展現個性。","ex":"設計作品、寫文章、拍影片、表演或規劃活動。","q":"我最想創造什麼？是否給自己空間嘗試與展現創意？"},{"id":"H05-04","el":"第五宮","name":"娛樂與生活樂趣","plain":"這裡關於休閒、娛樂與讓自己開心的活動；生活也需要放鬆和恢復活力。","ex":"看電影、唱歌、玩遊戲、旅行或安排休閒時間。","q":"什麼讓我真正快樂？是否允許自己享受生活？"},{"id":"H05-05","el":"第五宮","name":"冒險與投機機會","plain":"這裡關於嘗試、承擔風險與面對不確定結果；需要理解風險而非只期待好結果。","ex":"參加競賽、嘗試投資方式、參與冒險活動或投入未確定計畫。","q":"我願意承擔多大風險？這是評估後選擇還是一時興奮？"},{"id":"H06-01","el":"第六宮","name":"日常工作與勞務付出","plain":"這裡關於每天實際執行的工作、任務與勞務，讓生活正常運作。","ex":"完成每日工作、處理行政、安排客戶服務或固定任務。","q":"日常工作安排合理嗎？是否把時間花在瑣事而忽略重要事？"},{"id":"H06-02","el":"第六宮","name":"健康管理與身體照護","plain":"這裡關於身體保養、健康管理與日常照護，包括作息、飲食、睡眠與活動。","ex":"健康檢查、運動、調整飲食、改善睡眠或就醫追蹤。","q":"身體最近發出什麼訊號？是否給自己足夠休息與照顧？"},{"id":"H06-03","el":"第六宮","name":"服務精神與實際貢獻","plain":"這裡關於透過日常工作與行動為別人提供協助，讓周圍的人受益。","ex":"協助同事、提供客戶服務，或主動處理團隊需要的工作。","q":"我的付出帶來什麼價值？能否服務別人也維持生活平衡？"},{"id":"H06-04","el":"第六宮","name":"日常秩序與生活習慣","plain":"這裡關於每天反覆進行的生活安排與習慣；秩序能減少混亂。","ex":"固定起床、整理環境、安排每週計畫或建立健康習慣。","q":"日常習慣正在幫助我還是消耗我？哪個小習慣值得調整？"},{"id":"H06-05","el":"第六宮","name":"職場從屬與工作協作","plain":"這裡關於工作組織中的角色、分工與合作，以及與主管同事的互動。","ex":"確認工作內容、同事分工、配合流程或完成共同任務。","q":"我在團隊扮演什麼角色？是否清楚責任並表達工作需求？"},{"id":"H07-01","el":"第七宮","name":"婚姻與長期伴侶關係","plain":"這裡關於長期伴侶、婚姻與共同生活，需要溝通、分工、承諾與尊重差異。","ex":"討論家庭開支、安排共同生活，或面對伴侶不同意見。","q":"我期待什麼長期關係？能否親密又尊重彼此獨立？"},{"id":"H07-02","el":"第七宮","name":"合作與契約關係","plain":"這裡關於正式合作，以及透過約定或契約確立雙方權利與責任。","ex":"簽合作合約、尋找夥伴、確認服務條件或共同經營計畫。","q":"合作雙方責任清楚嗎？是否說明彼此期待與約定？"},{"id":"H07-03","el":"第七宮","name":"一對一關係與互動模式","plain":"這裡關於與另一個人如何相處，以及一對一關係呈現的互動方式。","ex":"深度交談、一對一諮詢，或討論彼此想法。","q":"我在一對一關係中扮演什麼角色？能表達自己也理解對方嗎？"},{"id":"H07-04","el":"第七宮","name":"公開對手與競爭關係","plain":"這裡關於公開競爭者、對立關係與不同立場；競爭也能讓人看見優勢與不足。","ex":"商業競爭、公開評比、爭取資源或協商立場。","q":"我面對什麼競爭？能維護利益又保持理性公平嗎？"},{"id":"H07-05","el":"第七宮","name":"關係投射與自我照見","plain":"這裡關於從別人身上看見自己的期待、恐懼或不易察覺的部分。","ex":"在意某人的態度、反覆被相似類型吸引，或重複相同互動模式。","q":"我對對方的反應是否反映自己的需求？這段關係讓我看見什麼？"},{"id":"H08-01","el":"第八宮","name":"死亡與生命終結","plain":"這裡關於生命有限、結束與告別，以及如何面對失去與不可避免的變化。","ex":"面對親友離世、思考生命規劃、整理重要文件，或重新珍惜生活。","q":"我如何看待結束與告別？最想把時間留給誰或什麼？"},{"id":"H08-02","el":"第八宮","name":"遺產與他人財務","plain":"這裡關於來自別人的財務資源，以及遺產、保險、貸款、稅務等安排。","ex":"處理遺產、了解理賠、共同貸款，或討論財產分配。","q":"我清楚與他人的財務責任嗎？能否兼顧權益與關係？"},{"id":"H08-03","el":"第八宮","name":"共同資源與利益分配","plain":"這裡關於多人共同擁有、管理與使用的資源，需要協議與信任。","ex":"夫妻共同管理財務、合夥分收益、共同投資或分擔家用。","q":"我們共享哪些資源？投入、責任與利益分配有共識嗎？"},{"id":"H08-04","el":"第八宮","name":"深層心理與親密信任","plain":"這裡關於深層情感、內在秘密與親密關係中的信任，也需要尊重隱私與界線。","ex":"與伴侶分享恐懼、向信任的人談過去，或面對親密關係的隱私問題。","q":"我願意讓別人理解自己嗎？親密關係需要哪些信任與界線？"},{"id":"H08-05","el":"第八宮","name":"危機轉化與生命重生","plain":"這裡關於面對重大變化、危機與失去時，如何重新整理自己並建立新方向。","ex":"事業變動、關係結束、財務危機，或重大事件後重整生活。","q":"困境讓我看見什麼？能從經歷中重新建立哪些能力與選擇？"},{"id":"H09-01","el":"第九宮","name":"高等教育與知識探索","plain":"這裡關於深入學習、專業進修與高等知識探索，建立更完整理解。","ex":"攻讀學位、專業進修、研究學術領域或長期專業學習。","q":"還有哪些知識想深入探索？學習是否拓展視野與能力？"},{"id":"H09-02","el":"第九宮","name":"哲學信念與人生意義","plain":"這裡關於理解人生、世界與存在的意義，信念會影響重大選擇。","ex":"思考人生目標、閱讀哲學作品、討論生命價值或檢視原則。","q":"我相信什麼人生價值？這些信念符合現在的我嗎？"},{"id":"H09-03","el":"第九宮","name":"宗教信仰與靈性追求","plain":"這裡關於宗教、信仰與精神探索，透過不同方式尋找內心安定與生命意義。","ex":"宗教活動、靈性閱讀、冥想，或探索不同信仰傳統。","q":"什麼信念或實踐支持我？能否保有獨立思考與尊重？"},{"id":"H09-04","el":"第九宮","name":"遠行與異國文化探索","plain":"這裡關於遠距旅行、跨國移動與接觸不同文化，離開熟悉環境也能拓展視野。","ex":"出國旅行、海外留學、跨國工作或認識異國生活習慣。","q":"我願意接觸不同文化嗎？離開熟悉環境可能發現什麼？"},{"id":"H09-05","el":"第九宮","name":"智慧傳播與思想交流","plain":"這裡關於分享知識、理念與人生經驗，透過教學、出版、演講影響他人思想。","ex":"擔任講師、寫文章、出版作品、演講或跨領域交流。","q":"有哪些經驗值得分享？如何讓知識成為別人的學習資源？"},{"id":"H10-01","el":"第十宮","name":"事業發展與職業方向","plain":"這裡關於職業選擇、事業發展與希望從事的工作，也包含未來專業方向。","ex":"選擇職業、轉職、創業、建立品牌或重新定位專業。","q":"目前工作方向符合期待嗎？未來希望發展什麼專業角色？"},{"id":"H10-02","el":"第十宮","name":"社會地位與成就追求","plain":"這裡關於希望在社會建立的位置，以及如何定義自己的成就。","ex":"升遷、建立專業聲望、經營企業，或成為受信任的人。","q":"我心目中的成功是什麼？是自己想要還是社會標準？"},{"id":"H10-03","el":"第十宮","name":"權威責任與領導角色","plain":"這裡關於管理與領導責任，以及如何運用權限做決策並承擔結果。","ex":"擔任主管、管理團隊、負責營運或代表組織處理事務。","q":"我如何運用權力與責任？願意承擔領導帶來的結果嗎？"},{"id":"H10-04","el":"第十宮","name":"公眾形象與社會評價","plain":"這裡關於別人如何認識你，以及工作與社會中的公開形象。","ex":"經營個人品牌、公開演講、媒體訪問或建立企業形象。","q":"我希望別人如何認識我？公開形象符合重視的價值嗎？"},{"id":"H10-05","el":"第十宮","name":"人生目標與長期成就","plain":"這裡關於長期人生方向與希望透過時間完成的成果，也可能是使命與傳承。","ex":"規劃十年職涯、建立事業、完成重要計畫或思考退休成果。","q":"我希望長期完成什麼？現在的努力正在累積成想要的人生嗎？"},{"id":"H11-01","el":"第十一宮","name":"朋友與人際支持","plain":"這裡關於朋友、同儕與可以互相支持的人；友誼是生活中的重要資源。","ex":"與朋友聚會、請教熟人、困難時獲得支持或維繫友誼。","q":"哪些朋友是重要支持？我也有成為別人支持嗎？"},{"id":"H11-02","el":"第十一宮","name":"團體組織與社群參與","plain":"這裡關於加入團體、組織或社群，透過群體參與擴展生活與資源。","ex":"加入協會、社團、社群，或和同好舉辦活動。","q":"參與的團體符合興趣理念嗎？我能帶來什麼貢獻？"},{"id":"H11-03","el":"第十一宮","name":"貴人與機會資源","plain":"這裡關於透過朋友、團體與人際網絡獲得支持與機會；貴人也可能是分享資訊的人。","ex":"朋友介紹合作、社群分享工作資訊，或認識互相支持的夥伴。","q":"哪些人或群體帶來可能？我是否主動建立連結並讓人認識能力？"},{"id":"H11-04","el":"第十一宮","name":"希望願景與未來理想","plain":"這裡關於對未來的期待，以及希望逐步實現的願景。","ex":"規劃未來生活、設定長期目標、想像理想工作模式或建立計畫。","q":"我真正期待什麼未來？現在能做哪件事讓理想靠近？"},{"id":"H11-05","el":"第十一宮","name":"共同理念與社會參與","plain":"這裡關於與別人分享共同理念，透過團體或社會行動創造改變。","ex":"參與公益、推動社區改善、加入倡議團體或共同實現目標。","q":"有哪些理念希望共同實現？如何把想法轉成社會參與？"},{"id":"H12-01","el":"第十二宮","name":"隱藏事務與幕後活動","plain":"這裡關於不容易被外界看見的事情，以及幕後工作與準備；有些事需要安靜完成。","ex":"私下準備計畫、幕後協助團隊、整理未公開資料或低調完成工作。","q":"有哪些事情正在幕後進行？自己是否也看見這些付出？"},{"id":"H12-02","el":"第十二宮","name":"隔離限制與失去自由","plain":"這裡關於受到環境、制度或現實條件限制，以及獨處、隔離或暫時無法自由行動。","ex":"因工作家庭責任缺少自由時間、住院休養、制度限制或困在難改變環境。","q":"我感受到哪些限制？哪些是外在條件，哪些仍可調整？"},{"id":"H12-03","el":"第十二宮","name":"潛意識與內在陰影","plain":"這裡關於藏在不易察覺處的情緒、恐懼與想法，它們可能影響日常反應。","ex":"對某些情境莫名害怕、反覆夢境，或出現不符合意願的反應。","q":"有哪些感受平常不願面對？能否花時間理解反應背後原因？"},{"id":"H12-04","el":"第十二宮","name":"自我消耗與隱性困境","plain":"這裡關於不知不覺消耗精神與時間，例如過度擔心、長期忍耐或承擔隱性壓力。","ex":"很累卻不敢休息、把問題藏起來、擔心別人感受或重複無結果的事。","q":"哪些事情正在消耗我？是否需要停止不必要付出？"},{"id":"H12-05","el":"第十二宮","name":"精神探索與內在療癒","plain":"這裡關於獨處、靜心、精神探索與內在整理，讓自己逐漸恢復平靜。","ex":"冥想、寫日記、接觸藝術音樂、心理探索或安排獨處。","q":"什麼方式讓我重新平靜？是否願意給自己時間理解內在需要？"}]};

const label = (k,i)=> k==="s" ? i.el+"座" : i.el;
const pick = a => a[Math.floor(Math.random()*a.length)];
const $ = id => document.getElementById(id);
const dice = {p:$("d-p"), s:$("d-s"), h:$("d-h")};
const reduced = matchMedia("(prefers-reduced-motion:reduce)").matches;
const esc = s => String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let busy = false;

for (const k of ["p","s","h"]){
  $("w-"+k).src = IMGS.whole[k];
  dice[k].querySelector(".face").src = IMGS.whole[k];
}
function show(k, item){
  const im = dice[k].querySelector(".face");
  im.classList.remove("whole"); im.src = IMGS.face[k][item.el]; im.alt = label(k,item);
  dice[k].querySelector(".name").textContent = label(k,item);
}
function card(n, k, i){
  const b = BI[n], top = ((b.by-40)/10.24).toFixed(2);
  return '<article class="bar fade" style="border-image-source:url('+b.img+');min-height:'+(b.h/10.24).toFixed(2)+'cqw">'+
    '<img class="badge" alt="" src="'+b.badge+'" style="top:'+top+'cqw">'+
    '<h3>'+esc(label(k,i))+'・'+esc(i.name)+'</h3><p>'+esc(i.plain)+'</p>'+
    '<p class="ex">例如：'+esc(i.ex)+'</p><p class="q">想一想：'+esc(i.q)+'</p></article>';
}
function roll(){
  if (busy) return; busy = true;
  $("s1").hidden = true; $("s2").hidden = false; window.scrollTo(0,0);
  $("reading").innerHTML = ""; $("roll2").disabled = true;
  const res = {p:pick(DATA.p), s:pick(DATA.s), h:pick(DATA.h)};
  const stop = {p:900, s:1300, h:1700};
  let done = 0;
  for (const k of ["p","s","h"]){
    dice[k].classList.remove("set"); dice[k].classList.add("rolling");
    const t = setInterval(()=>show(k, pick(DATA[k])), 70);
    setTimeout(()=>{
      clearInterval(t); dice[k].classList.remove("rolling"); show(k, res[k]); dice[k].classList.add("set");
      if (++done === 3){
        $("reading").innerHTML = card(0,"p",res.p)+card(1,"s",res.s)+card(2,"h",res.h);
        $("roll2").disabled = false; busy = false;
      }
    }, reduced ? 0 : stop[k]);
  }
}
$("roll1").addEventListener("click", roll);
$("roll2").addEventListener("click", roll);
</script>
